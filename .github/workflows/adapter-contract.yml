name: Adapter contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check App Panel, named parameters, source tree, and provenance
        run: python3 tests/check_adapter_contract.py
      - name: Verify contract mutation detection
        run: python3 -m unittest discover -s tests -p 'test_*.py'
